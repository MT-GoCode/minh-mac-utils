# gitas accounts — copy, fill in, keep OUT of git. Installed to ~/.config/gitas/accounts.ini (0600).
#
# The FIRST section is the default: any repo that matches nothing uses it.
#   name  / email  → commit authorship
#   user  / token  → HTTPS auth (GitHub username + PAT)
#   match          → comma-separated host/path globs that select this account
#
# PATs: github.com/settings/tokens — scopes 'repo' + 'workflow'.

[personal]
name  = Minh Trinh
email = tminh.us@gmail.com
user  = MT-GoCode
token = ghp_PUT_YOURS_HERE
match = github.com/MT-GoCode/*

# Anything not matched above falls through to [personal] — so cloning another org's repo
# for personal reasons needs no entry at all.

# [work]
# name  = Minh Trinh
# email = minh@datologyai.com
# user  = your-work-github-username
# token = github_pat_PUT_YOURS_HERE
# match = github.com/datologyai/*
