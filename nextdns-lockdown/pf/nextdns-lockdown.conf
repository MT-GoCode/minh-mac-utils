#
# nextdns-lockdown.conf
# Force ALL DNS through the local NextDNS resolver (127.0.0.1:53); fail-closed.
#
# Loaded by /usr/local/bin/nextdns-lockdownd via:  pfctl -f <this>  then  pfctl -e
# ALWAYS validated with `pfctl -n -f <this>` before any load (install.sh + the daemon do this).
#
# ============================ SAFETY NOTES ============================
# This is a DEFAULT-PASS ruleset. It does NOT firewall the machine.
# It only:
#   (a) blocks plain DNS (port 53) to anything except loopback,
#   (b) blocks DoT/DoQ (port 853) everywhere,
#   (c) blocks known public DoH/DoT resolver IPs on all ports,
#   (d) blocks common VPN protocols,
#   (e) blocks UDP/443 (QUIC / DoH3 / iCloud Private Relay / QUIC-VPNs).
#
# General web traffic (TCP 80 and TCP 443 to normal websites) is UNTOUCHED,
# so browsers keep working normally.
#
# Loopback is skipped entirely (`set skip on lo0`), so the NextDNS path
# (127.0.0.1:53  ->  DoH/443 upstream to NextDNS) is never affected by any
# rule below. NextDNS itself uses 443 outbound, which stays open.
# =====================================================================

# ---------- options ----------
set block-policy drop
set skip on lo0

# ---------- tables ----------
# Populated from files so they can be updated without editing this ruleset.
table <doh_resolvers> persist file "/usr/local/etc/nextdns-lockdown/doh-blocklist.txt"
table <tor_dirauth>   persist file "/usr/local/etc/nextdns-lockdown/tor-dirauth.txt"
# dns_allow is normally EMPTY. Travel-mode (captive portals) live-adds the
# current default gateway here for a few minutes, then the daemon flushes it.
table <dns_allow>     persist file "/usr/local/etc/nextdns-lockdown/dns-allow.txt"

# ---------- Apple default anchors (preserve system services: AirDrop, App Firewall, etc.) ----------
scrub-anchor "com.apple/*"
nat-anchor "com.apple/*"
rdr-anchor "com.apple/*"
dummynet-anchor "com.apple/*"
anchor "com.apple/*"
load anchor "com.apple" from "/etc/pf.anchors/com.apple"

# ======================= DNS ENFORCEMENT =======================
# Allow DNS only to explicitly permitted targets (travel-mode gateway lives here).
pass  out quick proto { tcp udp } to <dns_allow> port { 53 853 } label "nextdns-lockdown-allow"

# Block plain DNS (53) and DoT/DoQ (853) to everything else, IPv4 + IPv6, udp + tcp.
# Loopback (127.0.0.1 / ::1) is exempt via `set skip on lo0`, so NextDNS still works.
block drop out quick proto { tcp udp } to any port 53  label "nextdns-lockdown-dns53"
block drop out quick proto { tcp udp } to any port 853 label "nextdns-lockdown-dot853"

# Block known public DoH/DoT/DoQ resolver IPs on ALL ports.
# This is what kills the literal-IP DoH trick (e.g. curl https://1.1.1.1/dns-query),
# which NextDNS's hostname blocking CANNOT stop.
block drop out quick to <doh_resolvers> label "nextdns-lockdown-doh"

# ======================= TOR =======================
# Speed bump only. Vanilla Tor bootstrap hits these directory authorities.
# Pluggable transports (obfs4 / meek / snowflake) ride CDNs on TCP 443 and
# CANNOT be blocked here without breaking the web. Documented in README.
block drop out quick to <tor_dirauth> label "nextdns-lockdown-tor"

# ======================= VPN PROTOCOLS =======================
# Stops consumer + macOS-built-in VPNs whose tunnels would carry DNS around NextDNS.
#   UDP 500/4500 = IKEv2/IPSec (macOS built-in VPN)   UDP 1701 = L2TP
#   1194 = OpenVPN default      1723 = PPTP control    51820-51829 = WireGuard
#   ESP (proto 50)/AH (proto 51) = IPSec payload       GRE (proto 47) = PPTP/tunnels
# NOTE: a VPN deliberately configured for TCP/443 "stealth/obfuscated" mode is
# indistinguishable from HTTPS and is NOT blocked here (see README residuals).
block drop out quick proto udp to any port { 500 4500 1701 1194 } label "nextdns-lockdown-vpn-udp"
block drop out quick proto tcp to any port { 1194 1723 }          label "nextdns-lockdown-vpn-tcp"
block drop out quick proto udp to any port 51820:51829            label "nextdns-lockdown-wireguard"
block drop out quick proto esp label "nextdns-lockdown-esp"
block drop out quick proto ah  label "nextdns-lockdown-ah"
block drop out quick proto gre label "nextdns-lockdown-gre"

# ======================= QUIC / HTTP3 / DoH3 / iCloud Private Relay (UDP 443) =======================
# *** DISABLED BY DEFAULT *** (the rule below is commented out).
#
# Why off: the known public DoH resolver IPs are ALREADY blocked on ALL ports
# (incl. UDP 443) by the <doh_resolvers> rule above — so DoH-over-HTTP/3 to
# 1.1.1.1 / 8.8.8.8 / etc. is closed regardless. Turning this on only ADDS:
#   - blocking DoH3 to *unlisted* IPs (same irreducible residual as TCP/443 DoH), and
#   - blocking iCloud Private Relay's transport + exotic QUIC-obfuscated VPNs.
# It does NOT affect blocking of any standard VPN (their ports are blocked above).
#
# Cost of turning it on: this is the ONLY rule that touches QUIC/HTTP3. Video
# streaming and video CALLS still work (call media uses other UDP ports; web falls
# back to TCP/443) — but for a heavy video-call user it's the one rule most likely
# to add edge-case latency on a restrictive network. Not worth it for the marginal
# DNS gain, so it's left off.
#
# Better place to stop iCloud Private Relay: NextDNS's own "Block Bypass Methods" /
# "Disable iCloud Private Relay" profile toggle (handles it at the DNS layer).
#
# To enable max-aggression, UNCOMMENT the next line and run: sudo nextdns-lockdown reload
# block drop out quick proto udp to any port 443 label "nextdns-lockdown-quic443"
