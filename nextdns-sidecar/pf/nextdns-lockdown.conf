#
# nextdns-sidecar :: pf ruleset  (profile-mode, ported verbatim from nextdns-lockdown)
# The resolver is the macOS Encrypted-DNS PROFILE (DoH straight to NextDNS).
# This ruleset is ONLY the bypass wall: it does NOT set or pin any resolver.
#
# Loaded by `nextdns-sidecar enforcerd` via:  pfctl -f <this>  then  pfctl -e
# ALWAYS validated with `pfctl -n -f <this>` before any load.
#
# Rule labels keep the historic "nextdns-lockdown-*" names (the daemon greps the
# dns53 label to detect its ruleset) — do not rename without updating Lockdown.marker.
#
# ============================ SAFETY NOTES ============================
# DEFAULT-PASS ruleset. It does NOT firewall the machine; it only adds
# targeted `block quick` rules. General web (TCP 80/443 to normal sites,
# including NextDNS's own DoH on 443) is UNTOUCHED.
#
# Captive portals "just work": plaintext DNS (53) is passed to table <local_dns>,
# which the daemon keeps populated with LOCAL/PRIVATE ranges PLUS the current
# network's actual gateway/resolver (learned live each tick). Public 53 to
# anything NOT in <local_dns> is blocked.
#
# Fail-closed on profile loss: the daemon FLUSHES <local_dns> if the Encrypted-DNS
# profile is ever removed, so DNS cannot fall back to the gateway's unfiltered
# resolver — you get NO DNS until the profile is restored (or you disarm).
# =====================================================================

# ---------- options ----------
set block-policy drop
set skip on lo0

# ---------- tables ----------
table <doh_resolvers> persist file "/usr/local/etc/nextdns-sidecar/doh-blocklist.txt"
table <tor_dirauth>   persist file "/usr/local/etc/nextdns-sidecar/tor-dirauth.txt"
# Local/private ranges where plaintext 53 is allowed (captive portals + macOS
# captive detection). Managed by the daemon: present while the DoH profile is
# installed, FLUSHED (fail-closed) if it is ever removed.
table <local_dns>     persist file "/usr/local/etc/nextdns-sidecar/local-dns.txt"

# ---------- Apple default anchors (preserve AirDrop, App Firewall, etc.) ----------
scrub-anchor "com.apple/*"
nat-anchor "com.apple/*"
rdr-anchor "com.apple/*"
dummynet-anchor "com.apple/*"
anchor "com.apple/*"
load anchor "com.apple" from "/etc/pf.anchors/com.apple"

# ======================= DNS ENFORCEMENT =======================
# Allow plaintext DNS only to local/private resolvers (captive portals). Public
# DNS is blocked below. This pass MUST precede the block (first `quick` wins).
pass  out quick proto { tcp udp } to <local_dns> port 53 label "nextdns-lockdown-local53"

# Block plain DNS (53) to everything else, and ALL DoT/DoQ (853), v4 + v6.
block drop out quick proto { tcp udp } to any port 53  label "nextdns-lockdown-dns53"
block drop out quick proto { tcp udp } to any port 853 label "nextdns-lockdown-dot853"

# Block known public DoH/DoT/DoQ resolver IPs on ALL ports.
# This is what kills the literal-IP DoH trick (e.g. curl https://1.1.1.1/dns-query).
# NextDNS's own anycast (45.90.28/30) is NOT in this table — blocking it would
# self-DoS the profile's DoH path.
block drop out quick to <doh_resolvers> label "nextdns-lockdown-doh"

# ======================= TOR =======================
# Speed bump only. Pluggable transports ride CDNs on TCP 443 and can't be blocked
# here without breaking the web (documented in README).
block drop out quick to <tor_dirauth> label "nextdns-lockdown-tor"

# ======================= VPN PROTOCOLS =======================
#   UDP 500/4500 = IKEv2/IPSec (macOS built-in)   UDP 1701 = L2TP
#   1194 = OpenVPN   1723 = PPTP control   51820-51829 = WireGuard
#   ESP (50)/AH (51) = IPSec payload   GRE (47) = PPTP/tunnels
# A VPN deliberately run over TCP/443 "stealth" mode is indistinguishable from
# HTTPS and is NOT blocked here (see README residuals).
block drop out quick proto udp to any port { 500 4500 1701 1194 } label "nextdns-lockdown-vpn-udp"
block drop out quick proto tcp to any port { 1194 1723 }          label "nextdns-lockdown-vpn-tcp"
block drop out quick proto udp to any port 51820:51829            label "nextdns-lockdown-wireguard"
block drop out quick proto esp label "nextdns-lockdown-esp"
block drop out quick proto ah  label "nextdns-lockdown-ah"
block drop out quick proto gre label "nextdns-lockdown-gre"

# ======================= QUIC / HTTP3 / DoH3 (UDP 443) — OFF by default =======================
# The known DoH resolver IPs are already blocked on ALL ports (incl. UDP 443),
# so DoH3 to 1.1.1.1 / 8.8.8.8 is closed regardless. Enabling this only adds
# blocking DoH3 to *unlisted* IPs + iCloud Private Relay, at the cost of QUIC
# latency on video-heavy apps.
# block drop out quick proto udp to any port 443 label "nextdns-lockdown-quic443"
